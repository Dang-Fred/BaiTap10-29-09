# =============================== 
# CẤU HÌNH SERVER 
# =============================== 
server.port=8099

# =============================== 
# CẤU HÌNH THYMELEAF 
# =============================== 
spring.thymeleaf.cache=false 

# =============================== 
# CẤU HÌNH DATABASE SQL SERVER 
# =============================== 
spring.datasource.url=jdbc:sqlserver://localhost:1433;instanceName=SQLEXPRESS;databaseName=JWT_WebLoginDB;encrypt=false;trustServerCertificate=true;sslProtocol=TLSv1.2;characterEncoding=UTF-8 
spring.datasource.username=sa 
spring.datasource.password=123456

# =============================== 
# CẤU HÌNH JPA / HIBERNATE 
# =============================== 
spring.jpa.show-sql=false 
spring.jpa.properties.hibernate.format_sql=true 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# =============================== 
# CẤU HÌNH FILE UPLOAD 
# =============================== 
spring.servlet.multipart.enabled=true 
spring.servlet.multipart.max-file-size=5MB 
spring.servlet.multipart.max-request-size=10MB

# =============================== 
# CẤU HÌNH BẢO MẬT JWT 
# =============================== 
security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
security.jwt.expiration-time=3600000